<!doctype html>
<html><head><meta charset="utf-8"/><title>A-POC</title>
<style>html,body{margin:0;height:100%;background:#d0c4ad;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas>
<script>
(function(){
  var T = {"density":225,"flowSpeed":0.015,"cursorBend":0.5,"bgColor":"#d0c4ad","threadColor":"#ece4d2","dyeColor":"#172a5a","rustColor":"#b8561e","accentRarity":0.032,"dyeSize":1,"grainAmount":0.026,"showChrome":true,"paused":false};
  function h2r(h){var s=h.replace('#','');var n=s.length===3?s.split('').map(function(c){return parseInt(c+c,16)}):[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];return [n[0]/255,n[1]/255,n[2]/255]}
  var c = document.getElementById('c');
  var gl = c.getContext('webgl',{antialias:true});
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  function resize(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;gl.viewport(0,0,c.width,c.height)}
  resize(); addEventListener('resize',resize);
  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs="\nprecision highp float;\nuniform vec2 uRes;\nuniform vec2 uMouse;\nuniform vec2 uVel;\nuniform float uTime;\nuniform float uDensity;\nuniform float uCursorBend;\nuniform vec3 uBg;\nuniform vec3 uThread;\nuniform vec3 uDye;\nuniform vec3 uRust;\nuniform float uAccentRarity;\nuniform float uDyeSize;\nuniform float uGrain;\nuniform vec4 uDyes[8];\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nfloat noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash(i+vec2(0,0)),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }\nfloat fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }\nvoid main(){\n  vec2 uv = gl_FragCoord.xy / uRes.xy;\n  float aspect = uRes.x / uRes.y;\n  vec2 p = uv; p.x *= aspect;\n  vec2 m = uMouse; m.x *= aspect;\n  vec2 d = p - m; float r = length(d);\n  float ang = fbm(p * 2.5 + uTime * 0.05) * 3.14159;\n  float swirl = atan(d.y, d.x) + 1.5708;\n  float cursorBend = exp(-r * 2.5);\n  ang = mix(ang, swirl, cursorBend * uCursorBend);\n  ang += (uVel.x * 3.0) * cursorBend;\n  vec2 warpDir = vec2(cos(ang), sin(ang));\n  vec2 weftDir = vec2(-warpDir.y, warpDir.x);\n  float warpCoord = dot(p, warpDir) * uDensity;\n  float weftCoord = dot(p, weftDir) * uDensity;\n  float warpLine = 1.0 - abs(fract(warpCoord) - 0.5) * 2.0;\n  float weftLine = 1.0 - abs(fract(weftCoord) - 0.5) * 2.0;\n  warpLine = smoothstep(0.55, 0.95, warpLine);\n  weftLine = smoothstep(0.55, 0.95, weftLine);\n  float wi = floor(warpCoord);\n  float hi = floor(weftCoord);\n  float over = mod(wi + hi, 2.0);\n  float threadMask = max(warpLine, weftLine);\n  vec3 col = uBg;\n  vec3 topThread = uThread;\n  vec3 botThread = mix(uThread, uBg, 0.5);\n  vec3 threadCol = over > 0.5 ? (warpLine > weftLine ? topThread : botThread) : (warpLine > weftLine ? botThread : topThread);\n  col = mix(col, threadCol, threadMask);\n  float crossMask = warpLine * weftLine;\n  col = mix(col, col * 0.6, crossMask * 0.7);\n  float strandSeed = hash(vec2(wi, 0.0));\n  if (warpLine > weftLine && warpLine > 0.4) {\n    if (strandSeed > 1.0 - uAccentRarity) col = mix(col, uDye, warpLine * 0.85);\n    else if (strandSeed < uAccentRarity) col = mix(col, uRust, warpLine * 0.7);\n  }\n  float strandSeed2 = hash(vec2(0.0, hi));\n  if (weftLine > warpLine && weftLine > 0.4) {\n    if (strandSeed2 > 1.0 - uAccentRarity) col = mix(col, uDye, weftLine * 0.85);\n    else if (strandSeed2 < uAccentRarity) col = mix(col, uRust, weftLine * 0.7);\n  }\n  float dyeSum = 0.0;\n  for (int i = 0; i < 8; i++) {\n    vec4 dy = uDyes[i]; if (dy.w < 0.5) continue;\n    vec2 dd = p - dy.xy * vec2(aspect, 1.0);\n    float rr = length(dd);\n    float radius = sqrt(dy.z) * 0.35 * uDyeSize;\n    float edge = smoothstep(radius, radius * 0.7, rr);\n    edge *= 0.7 + 0.3 * fbm(p * 8.0 + dy.z);\n    edge *= smoothstep(4.0, 0.3, dy.z);\n    dyeSum += edge;\n  }\n  dyeSum = clamp(dyeSum, 0.0, 1.0);\n  col = mix(col, uDye, dyeSum * (0.4 + threadMask * 0.55));\n  col += exp(-r * 4.0) * 0.14 * vec3(1.0, 0.96, 0.88) * threadMask;\n  float vig = smoothstep(1.3, 0.3, length(uv - 0.5));\n  col *= mix(0.85, 1.0, vig);\n  float grain = hash(gl_FragCoord.xy + uTime);\n  col += (grain - 0.5) * uGrain;\n  gl_FragColor = vec4(col, 1.0);\n}\n  ";
  function co(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh}
  var p=gl.createProgram();gl.attachShader(p,co(gl.VERTEX_SHADER,vs));gl.attachShader(p,co(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var l=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  function U(n){return gl.getUniformLocation(p,n)}
  var u={Res:U('uRes'),Mouse:U('uMouse'),Vel:U('uVel'),Time:U('uTime'),Density:U('uDensity'),CursorBend:U('uCursorBend'),Bg:U('uBg'),Thread:U('uThread'),Dye:U('uDye'),Rust:U('uRust'),AccentRarity:U('uAccentRarity'),DyeSize:U('uDyeSize'),Grain:U('uGrain'),Dyes:U('uDyes')};
  var mx=0.5,my=0.5,sx=0.5,sy=0.5,vx=0,vy=0,lx=0.5,ly=0.5,t0=performance.now(),dyes=[];
  c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=1-(e.clientY-r.top)/r.height});
  c.addEventListener('pointerdown',function(e){var r=c.getBoundingClientRect();dyes.push({t:performance.now(),x:(e.clientX-r.left)/r.width,y:1-(e.clientY-r.top)/r.height})});
  function loop(){
    var now=performance.now();var dx=mx-lx,dy=my-ly;vx=vx*0.85+dx*0.15;vy=vy*0.85+dy*0.15;lx=mx;ly=my;
    sx+=(mx-sx)*0.14;sy+=(my-sy)*0.14;
    var packed=new Float32Array(32);var live=dyes.filter(function(d){return (now-d.t)/1000<4});dyes=live;
    for(var i=0;i<8;i++){var cc=live[i];if(cc){var age=(now-cc.t)/1000;packed[i*4]=cc.x;packed[i*4+1]=cc.y;packed[i*4+2]=age;packed[i*4+3]=1}else packed[i*4+3]=0}
    gl.uniform2f(u.Res,c.width,c.height);gl.uniform2f(u.Mouse,sx,sy);gl.uniform2f(u.Vel,vx,vy);
    gl.uniform1f(u.Time,(now-t0)/1000*(T.flowSpeed/0.05));
    gl.uniform1f(u.Density,T.density);gl.uniform1f(u.CursorBend,T.cursorBend);
    gl.uniform3fv(u.Bg,h2r(T.bgColor));gl.uniform3fv(u.Thread,h2r(T.threadColor));
    gl.uniform3fv(u.Dye,h2r(T.dyeColor));gl.uniform3fv(u.Rust,h2r(T.rustColor));
    gl.uniform1f(u.AccentRarity,T.accentRarity);gl.uniform1f(u.DyeSize,T.dyeSize);gl.uniform1f(u.Grain,T.grainAmount);
    gl.uniform4fv(u.Dyes,packed);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(loop)
  }
  loop();
})();
</script></body></html>
